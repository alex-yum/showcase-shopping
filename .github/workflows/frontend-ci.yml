name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run TypeScript type checking
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Security audit (dependencies)
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: Run unit and integration tests
        working-directory: ./frontend
        run: npm run test:coverage

      - name: Post coverage summary
        if: always()
        working-directory: ./frontend
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "coverage/coverage-summary.json" ]; then
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const rows = Object.entries(s).map(([k, v]) => \`| \${k} | \${v.pct}% (\${v.covered}/\${v.total}) |\`).join('\n');
              console.log('| Metric | Coverage |');
              console.log('|---|---|');
              console.log(rows);
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage-summary.json found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: frontend/coverage/

      - name: Build application
        working-directory: ./frontend
        run: npm run build | tee build-output.txt

      - name: Check bundle size budget
        working-directory: ./frontend
        run: node scripts/check-bundle-size.js build-output.txt

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run E2E tests
        working-directory: ./frontend
        run: npm run test:e2e

      - name: Run visual regression tests
        working-directory: ./frontend
        run: npm run test:visual
        continue-on-error: true

      - name: Upload visual regression diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: frontend/playwright-report/

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Upload E2E test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/

      - name: Test Summary
        if: always()
        working-directory: ./frontend
        run: |
          echo "## Frontend Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "coverage" ]; then
            echo "✅ Unit and integration tests completed with coverage" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -d "playwright-report" ]; then
            echo "✅ E2E tests completed across all browsers" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY
